# Serves the built React SPA and reverse-proxies API traffic to the backend
# container. Because the browser only talks to this one origin, there is no
# CORS preflight and same-site cookies behave normally.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress the JS/CSS bundle on the wire.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API calls -> backend service on the compose network. `backend` is the
    # compose service name; 3000 is its in-container port. Resolved at startup,
    # which is fine because compose's depends_on guarantees the backend
    # container exists before nginx boots.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Liveness/health endpoint.
    location = /health {
        proxy_pass       http://backend:3000/health;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets are immutable — their content hash is in the filename,
    # so a new build produces new names. Cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document must NEVER be cached: it is what points at the current
    # hashed bundles. Caching it is exactly what makes browsers keep loading a
    # stale homepage after a redeploy. Always revalidate.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA fallback: any other path serves index.html so React Router handles
    # deep links and hard refreshes client-side. The internal redirect re-enters
    # `location = /index.html` above, so the no-store header still applies.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
